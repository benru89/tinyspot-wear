plugins {
    id 'com.android.application'
}

// Signing lives outside the project so no key or password can end up in the
// source tree. Create it with tools/make-keystore.sh; without it, release
// builds fall back to the debug key (fine for sideloading, but such an APK
// cannot be upgraded by a properly signed one).
def keystorePropsFile = file("${System.getProperty('user.home')}/.config/tinyspot/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def abiList = (project.findProperty('tinyspot.abis') ?: 'armeabi-v7a').split(',')*.trim()

android {
    namespace 'com.rubfer.tinyspot'
    compileSdk 34
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.rubfer.tinyspot'
        minSdk 25          // Wear OS 2 floor (Android 7.1.1)
        targetSdk 28       // watch runs Android 9; avoids API 34 FGS-type rules
        versionCode 2
        versionName '0.1.1'

        // -Ptinyspot.testhooks=true enables the adb play/cmd intents in a
        // release build, for measuring the real (optimized) player.
        buildConfigField 'boolean', 'TEST_HOOKS',
                (project.findProperty('tinyspot.testhooks') ?: 'false')

        ndk {
            abiFilters(*abiList)
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.31.6'
        }
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Debug' } }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreProps['storeFile'] ? signingConfigs.release : signingConfigs.debug
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=MinSizeRel' } }
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging false }   // .so stays uncompressed, mmap'd from the APK
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures { buildConfig true }

    lint { abortOnError false }
}
